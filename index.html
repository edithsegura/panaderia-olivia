<style>
:root{
  --bg:#faf7f4;--card:#ffffff;--card2:#f5ede0;--side:#3d1e08;
  --brd:#e8d5bc;--gold:#c47a18;--goldL:#d4912a;--goldD:#8a5a1a;
  --cream:#3d1e08;--creamD:#5a3010;--txt:#2a1505;--muted:#8a6040;
  --grn:#2d7a3a;--red:#a83225;--amb:#c47a1a;--blu:#2a6cb5;
  --r:8px;
}
/* sidebar stays dark */
#sidebar{background:#3d1e08!important;border-right:1px solid #5a3010!important;}
#topbar{background:#3d1e08!important;border-bottom:1px solid #5a3010!important;}
.nav-btn .nl{color:#c4a87a!important;}
.nav-btn.active .nl{color:#e8b05a!important;}
.nav-btn:hover{background:rgba(232,176,90,.15)!important;}
.nav-btn.active{background:rgba(232,176,90,.2)!important;border-left-color:#e8b05a!important;}
.sb-logo-title{color:#e8b05a!important;}
.sb-logo-sub{color:#c4a87a!important;}
#topbar #topbar-title{color:#f5e6c8!important;}
#topbar span{color:#c4a87a!important;}
#bottomnav{background:rgba(61,30,8,.97)!important;}
.bnav-btn .bl{color:#c4a87a!important;}
.bnav-btn.active .bl{color:#e8b05a!important;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;}
input,select,button,textarea{font-family:inherit;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--brd);border-radius:2px;}
input::placeholder{color:var(--muted);}

/* ── LAYOUT ─────────────────────────────────────── */
#app{display:flex;height:100vh;overflow:hidden;}
#sidebar{width:220px;background:var(--side);border-right:1px solid var(--brd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;}
#sidebar.collapsed{width:0;overflow:hidden;}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#topbar{height:52px;background:var(--side);border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;}
#content{flex:1;overflow-y:auto;padding:24px;}

/* ── SIDEBAR ────────────────────────────────────── */
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid var(--brd);}
.sb-logo-title{font-size:13px;font-weight:700;color:var(--gold);}
.sb-logo-sub{font-size:9px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.1em;}
#nav{flex:1;padding:8px 6px;overflow-y:auto;}
.nav-btn{width:100%;display:flex;align-items:center;gap:9px;background:transparent;border:none;border-left:3px solid transparent;border-radius:0 6px 6px 0;padding:9px 11px;cursor:pointer;text-align:left;margin-bottom:2px;transition:all .15s;}
.nav-btn:hover{background:rgba(212,145,42,.08);}
.nav-btn.active{background:rgba(212,145,42,.14);border-left-color:var(--gold);}
.nav-btn .ni{font-size:15px;}
.nav-btn .nl{font-size:13px;color:var(--muted);}
.nav-btn.active .nl{color:var(--gold);font-weight:700;}
.sb-footer{padding:12px 14px;border-top:1px solid var(--brd);}

/* ── COMPONENTS ─────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;}
.divider{font-size:9px;color:var(--gold);font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:4px 0 12px;display:flex;align-items:center;gap:8px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(212,145,42,.3);}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}

/* ── BUTTONS ────────────────────────────────────── */
.btn{border:none;border-radius:var(--r);padding:9px 16px;font-size:13px;cursor:pointer;font-weight:600;transition:opacity .15s;}
.btn:hover{opacity:.88;}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--goldL));color:#1a0a02;}
.btn-grn{background:#1a5c25;border:1px solid var(--grn);color:#7aba88;}
.btn-out{background:var(--card2);border:1px solid var(--brd);color:var(--creamD);}
.btn-red{background:rgba(168,50,37,.15);border:1px solid rgba(168,50,37,.4);color:var(--red);}
.btn-sm{padding:5px 11px;font-size:11px;}
.btn-full{width:100%;}
.btn-icon{padding:7px 11px;font-size:14px;}

/* ── INPUTS ─────────────────────────────────────── */
.field{margin-bottom:11px;}
.field label{display:block;font-size:9px;color:var(--muted);margin-bottom:4px;letter-spacing:.07em;text-transform:uppercase;}
.field input,.field select,.field textarea{width:100%;background:#140c05;border:1px solid var(--brd);border-radius:6px;padding:8px 11px;color:var(--txt);font-size:13px;outline:none;}
.field textarea{resize:vertical;min-height:60px;}

/* ── TABLE ──────────────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:10px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;padding:10px 14px;text-align:left;border-bottom:1px solid var(--brd);}
.tbl td{padding:11px 14px;border-bottom:1px solid rgba(61,36,16,.5);font-size:13px;}
.tbl tr:hover td{background:rgba(255,255,255,.02);}

/* ── MODAL ──────────────────────────────────────── */
.modal-bg{display:none;position:fixed;inset:0;background:#000000bb;z-index:200;align-items:center;justify-content:center;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:#1e1007;border:1px solid var(--brd);border-radius:12px;width:100%;max-width:540px;max-height:88vh;overflow-y:auto;}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--brd);position:sticky;top:0;background:#1e1007;z-index:1;}
.modal-head h3{color:var(--cream);font-size:15px;}
.modal-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:22px;line-height:1;}
.modal-body{padding:16px 18px 24px;}

/* ── TOAST ──────────────────────────────────────── */
#toast{position:fixed;bottom:24px;right:24px;background:#1a5c25;border:1px solid var(--grn);color:#7aba88;padding:11px 18px;border-radius:20px;font-size:12px;font-weight:600;z-index:500;display:none;white-space:nowrap;}

/* ── BAR CHART ──────────────────────────────────── */
.barchart{display:flex;align-items:flex-end;gap:5px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.bar-fill{width:100%;border-radius:3px 3px 0 0;min-height:4px;transition:height .4s;}
.bar-lbl{font-size:8px;color:var(--muted);white-space:nowrap;}

/* ── PROG BAR ───────────────────────────────────── */
.prog{height:4px;background:var(--brd);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;border-radius:2px;}

/* ── KPI ────────────────────────────────────────── */
.kpi{text-align:center;padding:14px 10px;}
.kpi .kpi-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px;}
.kpi .kpi-val{font-size:22px;font-weight:800;}
.kpi .kpi-sub{font-size:10px;color:var(--muted);margin-top:2px;}

/* ── PROD CARD ──────────────────────────────────── */
.prod-card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:border-color .2s;}
.prod-card:hover{border-color:var(--goldD);}
.prod-img{width:100%;height:140px;object-fit:cover;background:#0d0806;display:block;}
.prod-body{padding:10px 11px 12px;}

/* ── PAGO SELECTOR ──────────────────────────────── */
.pago-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.pago-btn{background:#140c05;border:2px solid var(--brd);border-radius:var(--r);padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .15s;}
.pago-btn.active{background:rgba(42,108,181,.2);border-color:var(--blu);}
.pago-btn .pi{font-size:20px;}
.pago-btn .pl{font-size:11px;font-weight:700;color:var(--muted);}
.pago-btn.active .pl{color:var(--blu);}

/* ── FOTO UPLOADER ──────────────────────────────── */
.foto-preview{position:relative;border-radius:var(--r);overflow:hidden;height:120px;margin-bottom:8px;}
.foto-preview img{width:100%;height:100%;object-fit:cover;}
.foto-drop{background:#140c05;border:2px dashed var(--brd);border-radius:var(--r);padding:18px;text-align:center;cursor:pointer;transition:all .2s;}
.foto-drop:hover,.foto-drop.drag{background:var(--card2);border-color:var(--gold);}
.foto-tabs{display:flex;border-radius:6px;overflow:hidden;border:1px solid var(--brd);margin-bottom:10px;}
.foto-tab{flex:1;background:#140c05;border:none;padding:7px 4px;font-size:10px;color:var(--muted);cursor:pointer;transition:all .15s;}
.foto-tab.active{background:var(--card2);color:var(--gold);font-weight:700;}

/* ── FAB ────────────────────────────────────────── */
#fab{position:fixed;bottom:24px;right:24px;width:54px;height:54px;background:linear-gradient(135deg,#1a7a2a,#25a040);border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:90;text-decoration:none;font-size:26px;box-shadow:0 4px 20px rgba(26,122,42,.7);animation:fabPulse 2.5s infinite;}
@keyframes fabPulse{0%{box-shadow:0 4px 20px rgba(26,122,42,.8),0 0 0 0 rgba(26,122,42,.5);}70%{box-shadow:0 4px 20px rgba(26,122,42,.8),0 0 0 12px rgba(26,122,42,0);}100%{box-shadow:0 4px 20px rgba(26,122,42,.8),0 0 0 0 rgba(26,122,42,0);}}

/* ── MOBILE ─────────────────────────────────────── */
@media(max-width:768px){
  #sidebar{display:none;}
  #content{padding:14px 12px 90px;}
  .grid4{grid-template-columns:1fr 1fr;}
  .grid3{grid-template-columns:1fr 1fr;}
  #bottomnav{display:flex!important;}
  .modal-bg.show{align-items:flex-end;padding:0;}
  .modal{border-radius:14px 14px 0 0;max-height:90vh;}
}
#bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(36,21,9,.97);backdrop-filter:blur(10px);border-top:1px solid var(--brd);z-index:60;justify-content:space-around;padding:6px 0 12px;}
.bnav-btn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:3px 6px;min-width:44px;}
.bnav-btn .bi{font-size:16px;}
.bnav-btn .bl{font-size:8px;color:var(--muted);}
.bnav-btn.active .bl{color:var(--gold);font-weight:700;}
.bnav-dot{width:12px;height:2px;background:var(--gold);border-radius:1px;margin-top:1px;display:none;}
.bnav-btn.active .bnav-dot{display:block;}
</style>
</head>

const TAB_TITLES={"dashboard":"◈ Dashboard","pedidos":"🛒 Pedidos","catalogo":"📸 Catálogo","clientes":"👥 Clientes","stock":"📦 Stock","reportes":"📊 Reportes","remitos":"📄 Remitos"};

function goTab(tab){
  currentTab=tab;
  document.querySelectorAll(".nav-btn").forEach((b,i)=>b.classList.toggle("active",["dashboard","pedidos","catalogo","clientes","stock","reportes","remitos"][i]===tab));
  document.querySelectorAll(".bnav-btn").forEach((b,i)=>b.classList.toggle("active",["dashboard","pedidos","catalogo","clientes","stock","reportes","remitos"][i]===tab));
  document.getElementById("topbar-title").textContent=TAB_TITLES[tab]||tab;
  render();
}

function toggleSidebar(){document.getElementById("sidebar").classList.toggle("collapsed");}

function render(){
  const c=document.getElementById("content");
  if(currentTab==="dashboard") c.innerHTML=renderDash();
  else if(currentTab==="pedidos") c.innerHTML=renderPedidos();
  else if(currentTab==="catalogo") c.innerHTML=renderCatalogo();
  else if(currentTab==="clientes") c.innerHTML=renderClientes();
  else if(currentTab==="stock") c.innerHTML=renderStock();
  else if(currentTab==="reportes") c.innerHTML=renderReportes();
  else if(currentTab==="remitos") c.innerHTML=renderRemitos();
  bindEvents();
}

function fotoUploaderHtml(currentFoto,fieldId){
  return `
    <div style="margin-bottom:12px">
      <label style="display:block;font-size:9px;color:var(--muted);margin-bottom:6px;letter-spacing:.07em;text-transform:uppercase">Foto del producto</label>
      ${currentFoto?`<div style="position:relative;border-radius:8px;overflow:hidden;height:110px;margin-bottom:8px;">
        <img src="${currentFoto}" style="width:100%;height:100%;object-fit:cover;" onerror="this.src='${FD.default}'">
        <button onclick="clearFoto('${fieldId}')" style="position:absolute;top:5px;right:5px;background:#000c;border:none;color:#fff;border-radius:20px;padding:2px 8px;font-size:11px;cursor:pointer;">× Quitar</button>
      </div>`:''}
      <div class="foto-tabs">
        <button class="foto-tab active" onclick="switchFotoTab(this,'archivo','${fieldId}')">📁 Archivo</button>
        <button class="foto-tab" onclick="switchFotoTab(this,'url','${fieldId}')">🔗 URL</button>
      </div>
      <div id="ft-archivo-${fieldId}">
        <div class="foto-drop" onclick="document.getElementById('foto-file-${fieldId}').click()">
          <div style="font-size:22px;margin-bottom:4px">📂</div>
          <div style="font-size:12px;font-weight:600;color:var(--creamD)">Elegir foto del dispositivo</div>
          <div style="font-size:9px;color:var(--muted);margin-top:2px">JPG, PNG, WEBP · máx 5 MB</div>
        </div>
        <input type="file" id="foto-file-${fieldId}" accept="image/*" style="display:none" onchange="loadFotoFile(this,'${fieldId}')">
      </div>
      <div id="ft-url-${fieldId}" style="display:none">
        <div style="display:flex;gap:8px">
          <input id="foto-url-${fieldId}" type="text" placeholder="https://... enlace directo" style="flex:1;background:#140c05;border:1px solid var(--brd);border-radius:6px;padding:8px 10px;color:var(--txt);font-size:12px;outline:none">
          <button onclick="applyFotoUrl('${fieldId}')" class="btn btn-gold" style="padding:8px 12px;font-size:12px">Usar</button>
        </div>
      </div>
      <input type="hidden" id="foto-data-${fieldId}" value="${currentFoto||''}">
    </div>`;
}

function switchFotoTab(btn,tab,fid){
  btn.closest('.foto-tabs').querySelectorAll('.foto-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('ft-archivo-'+fid).style.display=tab==='archivo'?'':'none';
  document.getElementById('ft-url-'+fid).style.display=tab==='url'?'':'none';
}
function loadFotoFile(input,fid){
  const file=input.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{document.getElementById('foto-data-'+fid).value=e.target.result;render();}; // re-render to show preview — actually just update preview
  r.onload=e=>{
    const v=e.target.result;
    document.getElementById('foto-data-'+fid).value=v;
    // show preview
    const ft=document.getElementById('ft-archivo-'+fid);
    ft.insertAdjacentHTML('beforebegin',`<div id="foto-prev-${fid}" style="position:relative;border-radius:8px;overflow:hidden;height:110px;margin-bottom:8px;"><img src="${v}" style="width:100%;height:100%;object-fit:cover;"><button onclick="clearFotoPreview('${fid}')" style="position:absolute;top:5px;right:5px;background:#000c;border:none;color:#fff;border-radius:20px;padding:2px 8px;font-size:11px;cursor:pointer;">× Quitar</button></div>`);
  };
  r.readAsDataURL(file);
}
function applyFotoUrl(fid){
  const url=document.getElementById('foto-url-'+fid).value.trim();
  if(!url)return;
  document.getElementById('foto-data-'+fid).value=url;
  const ft=document.getElementById('ft-url-'+fid);
  const prev=document.getElementById('foto-prev-'+fid);
  if(prev)prev.remove();
  ft.insertAdjacentHTML('beforebegin',`<div id="foto-prev-${fid}" style="position:relative;border-radius:8px;overflow:hidden;height:110px;margin-bottom:8px;"><img src="${url}" style="width:100%;height:100%;object-fit:cover;" onerror="this.src='${FD.default}'"><button onclick="clearFotoPreview('${fid}')" style="position:absolute;top:5px;right:5px;background:#000c;border:none;color:#fff;border-radius:20px;padding:2px 8px;font-size:11px;cursor:pointer;">× Quitar</button></div>`);
}
function clearFotoPreview(fid){
  const prev=document.getElementById('foto-prev-'+fid);if(prev)prev.remove();
  document.getElementById('foto-data-'+fid).value='';
}
function clearFoto(fid){clearFotoPreview(fid);}

function getFotoValue(fid){
  const el=document.getElementById('foto-data-'+fid);
  return el?el.value||null:null;
}

// BAR CHART
// ═══════════════════════════════════════════════
function barChart(data,color='var(--gold)',h=80){
  const max=Math.max(...data.map(d=>d.v));
  return `<div class="barchart" style="height:${h}px">
    ${data.map((d,i)=>`<div class="bar-col">
      <div class="bar-fill" style="height:${Math.round((d.v/max)*(h-16))}px;background:${i===data.length-1?color:color+'66'}"></div>
      <span class="bar-lbl">${d.d}</span>
    </div>`).join('')}
  </div>`;
}

function openNuevoProd(){
  openModal("Nuevo Producto",formProd(null)+`<button class="btn btn-gold btn-full" style="margin-top:4px" onclick="saveProd(null)">💾 Guardar</button>`);
}
function openEditProd(id){
  const p=PRODS.find(x=>x.id===id);
  closeModal();
  setTimeout(()=>openModal("Editar: "+p.nom,formProd(p)+`<button class="btn btn-gold btn-full" style="margin-top:4px" onclick="saveProd('${id}')">💾 Guardar cambios</button>`),50);
}
function saveProd(editId){
  const nom=document.getElementById("p-nom").value.trim();if(!nom)return;
  const d={nom,desc:document.getElementById("p-desc").value,cat:document.getElementById("p-cat").value,uni:document.getElementById("p-uni").value,pMay:+document.getElementById("p-pmay").value,pMin:+document.getElementById("p-pmin").value,stk:+document.getElementById("p-stk").value,sMin:+document.getElementById("p-smin").value,foto:getFotoValue("prod")};
  d.est=d.stk>0?"disponible":"sin stock";
  if(editId){Object.assign(PRODS.find(p=>p.id===editId),d);toast("✓ Producto actualizado");}
  else{d.id="P"+String(PRODS.length+1).padStart(3,"0");d.cod="PROD-"+String(PRODS.length+1).padStart(3,"0");PRODS.push(d);toast("✓ Producto creado");}
  closeModal();render();
}
function deleteProd(id){
  if(!confirm("¿Eliminar este producto?"))return;
  PRODS=PRODS.filter(p=>p.id!==id);closeModal();toast("Producto eliminado");render();
}

function addToPedCarrito(pId,precio){
  pedCarrito[pId]=(pedCarrito[pId]||0)+1;
  updatePedCarritoUI();
  // update row border
  const row=document.getElementById("prow-"+pId);
  if(row)row.style.borderColor="var(--gold)";
  // update control
  const ctl=document.getElementById("pctl-"+pId);
  if(ctl){
    const q=pedCarrito[pId];
    ctl.innerHTML=`<div style="display:flex;align-items:center;gap:5px">
      <button class="btn btn-out" style="padding:3px 8px;font-size:14px" onclick="chgPedCarrito('${pId}',-1)">−</button>
      <span style="font-size:13px;color:var(--gold);font-weight:700;min-width:18px;text-align:center">${q}</span>
      <button class="btn btn-gold" style="padding:3px 8px;font-size:14px" onclick="chgPedCarrito('${pId}',1)">+</button>
    </div>`;
  }
}
function chgPedCarrito(pId,delta){
  pedCarrito[pId]=(pedCarrito[pId]||0)+delta;
  if(pedCarrito[pId]<=0){delete pedCarrito[pId];const r=document.getElementById("prow-"+pId);if(r)r.style.borderColor="var(--brd)";const c=document.getElementById("pctl-"+pId);if(c)c.innerHTML=`<button class="btn btn-gold" style="padding:5px 10px;font-size:13px" onclick="addToPedCarrito('${pId}',${PRODS.find(p=>p.id===pId)?.pMay||0})">+</button>`;}
  else{const c=document.getElementById("pctl-"+pId);if(c){const q=pedCarrito[pId];c.innerHTML=`<div style="display:flex;align-items:center;gap:5px"><button class="btn btn-out" style="padding:3px 8px;font-size:14px" onclick="chgPedCarrito('${pId}',-1)">−</button><span style="font-size:13px;color:var(--gold);font-weight:700;min-width:18px;text-align:center">${q}</span><button class="btn btn-gold" style="padding:3px 8px;font-size:14px" onclick="chgPedCarrito('${pId}',1)">+</button></div>`;}}
  updatePedCarritoUI();
}
function updatePedCarritoUI(){
  const entries=Object.entries(pedCarrito);
  const res=document.getElementById("ped-resumen");
  if(!res)return;
  if(entries.length===0){res.style.display="none";return;}
  res.style.display="block";
  let total=0;
  const html=entries.map(([pId,qty])=>{const pr=getPr(pId);const sub=qty*(PRODS.find(p=>p.id===pId)?.pMay||0);total+=sub;return`<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px"><span>${pr.nom} × ${qty}</span><span style="color:var(--gold)">${$n(sub)}</span></div>`;}).join('');
  document.getElementById("ped-items-list").innerHTML=html;
  document.getElementById("ped-total").textContent=$n(total);
}

}

let clienteCat="todos";
let clienteCarrito={};
let clientePago="efectivo";
let vistaActual="cliente"; // "cliente" | "admin"

function chgClienteCarrito(id,delta){
  clienteCarrito[id]=(clienteCarrito[id]||0)+delta;
  if(clienteCarrito[id]<=0)delete clienteCarrito[id];
  renderVistaCliente();
  if(document.getElementById("carrito-modal").style.display==="flex")renderCarritoCliente();
}

function toggleCarritoCliente(){
  const m=document.getElementById("carrito-modal");
  if(!m)return;
  const show=m.style.display!=="flex";
  m.style.display=show?"flex":"none";
  if(show)renderCarritoCliente();
}

function renderCarritoCliente(){
  const entries=Object.entries(clienteCarrito);
  const body=document.getElementById("carrito-body");
  if(!body)return;
  if(entries.length===0){body.innerHTML=`<div style="text-align:center;padding:30px 0;color:#8a6040"><div style="font-size:36px;margin-bottom:9px">🛒</div><div>Carrito vacío</div></div>`;return;}
  const total=entries.reduce((a,[id,q])=>{const p=PRODS.find(x=>x.id===id);return a+(p?p.pMay*q:0);},0);
  body.innerHTML=`
    <input id="cli-nombre" placeholder="Tu nombre (opcional)" style="width:100%;background:#faf7f4;border:1px solid #e8d5bc;border-radius:6px;padding:8px 12px;color:#2a1505;font-size:13px;outline:none;box-sizing:border-box;margin-bottom:12px">
    <div style="font-size:9px;color:#c47a18;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:11px;display:flex;align-items:center;gap:8px"><div style="flex:1;height:1px;background:rgba(196,122,26,.3)"></div>Productos<div style="flex:1;height:1px;background:rgba(196,122,26,.3)"></div></div>
    ${entries.map(([id,q])=>{const p=PRODS.find(x=>x.id===id);if(!p)return'';return`
    <div style="display:flex;border-bottom:1px solid #e8d5bc;padding:8px 0;align-items:center;gap:9px">
      <img loading="lazy" src="${fs(p)}" style="width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0" onerror="this.src='${FD.default}'">
      <div style="flex:1"><div style="font-size:12px;font-weight:600;color:#2a1505">${p.nom}</div><div style="font-size:10px;color:#c47a18">${$n(p.pMay)}/${p.uni}</div></div>
      <div style="display:flex;align-items:center;gap:5px">
        <button onclick="chgClienteCarrito('${id}',-1)" style="background:#e8d5bc;border:none;border-radius:4px;width:24px;height:24px;cursor:pointer;font-size:13px;font-weight:700">−</button>
        <span style="font-size:12px;color:#c47a18;font-weight:700;min-width:16px;text-align:center">${q}</span>
        <button onclick="chgClienteCarrito('${id}',1)" style="background:#c47a18;color:#fff;border:none;border-radius:4px;width:24px;height:24px;cursor:pointer;font-size:13px;font-weight:700">+</button>
      </div>
      <span style="font-size:12px;color:#c47a18;font-weight:700;min-width:66px;text-align:right">${$n(p.pMay*q)}</span>
    </div>`;}).join('')}
    <div style="display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid #e8d5bc">
      <span style="font-size:14px;color:#8a6040;font-weight:700">TOTAL</span>
      <span style="font-size:19px;color:#c47a18;font-weight:900">${$n(total)}</span>
    </div>
    <div style="margin-bottom:13px">
      <div style="font-size:9px;color:#8a6040;margin-bottom:8px;letter-spacing:.07em;text-transform:uppercase">Método de pago</div>

function armarMsgCliente(total){
  const nombre=document.getElementById("cli-nombre")?.value||"Cliente";
  const m=getMp(clientePago);
  let msg=`Hola Panadería Olivia 🥖

*Pedido de:* ${nombre}

`;
  Object.entries(clienteCarrito).forEach(([id,q])=>{const p=PRODS.find(x=>x.id===id);msg+=`• ${p?.nom} × ${q} ${p?.uni} = ${$n(p.pMay*q)}
`;});
  msg+=`
*Total:* ${$n(total)}
*Pago:* ${m.icon} ${m.label}`;
  // SAVE ORDER to PEDIDOS so admin can see it
  const items=Object.entries(clienteCarrito).map(([pId,qty])=>({pId,qty,precio:PRODS.find(p=>p.id===pId)?.pMay||0}));
  const newPed={id:"PED-"+String(PEDIDOS.length+46).padStart(4,"0"),cId:"CLIENTE",fecha:new Date().toISOString().split("T")[0],est:"pendiente",pago:clientePago,pagado:false,items,total,clienteNombre:nombre};
  PEDIDOS.unshift(newPed);
  return "https://wa.me/5493816477520?text="+encodeURIComponent(msg);
}

function doLogin(){
  const pass=document.getElementById("login-pass")?.value;
  if(pass==="olivia2026"){

    vistaActual="admin";

    document.getElementById("app").innerHTML=document.getElementById("app").innerHTML||"";
